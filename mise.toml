[tools]
typst = "0.15.1"

[tasks.build]
run = "typst compile thesis.typ thesis.pdf"

[tasks.watch]
run = "typst watch thesis.typ thesis.pdf"

[tasks.check]
run = "typst compile --diagnostic-format short thesis.typ thesis.pdf"

[tasks.compare]
depends = ["build"]
run = "test -n \"$REFERENCE_PDF\" && swift tools/pdf-compare.swift \"$REFERENCE_PDF\" thesis.pdf comparison"
