[tools]
typst = "0.15.1"

[tasks.build]
run = "typst compile thesis.typ thesis.pdf"

[tasks.watch]
run = "typst watch thesis.typ thesis.pdf"

[tasks.check]
run = [
  "typst compile --diagnostic-format short thesis.typ thesis.pdf",
  "typst compile --root . --diagnostic-format short tests/edge-cases.typ /tmp/hda-thesis-edge-cases.pdf",
]
